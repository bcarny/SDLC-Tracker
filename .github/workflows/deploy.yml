name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to dev
        run: |
          echo "Deploying to dev environment"
          # Add your deployment steps here (e.g. Railway CLI, Docker push, etc.)
          # Example for Railway: railway up --service ${{ secrets.RAILWAY_SERVICE_ID_DEV }}

  deploy-prod:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to prod
        run: |
          echo "Deploying to prod environment"
          # Add your deployment steps here
